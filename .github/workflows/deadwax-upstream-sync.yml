name: Deadwax · Upstream Release Check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deadwax-upstream-release-check
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Deadwax branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: deadwax
          fetch-depth: 0

      - name: Refresh the upstream release mirror
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream https://github.com/omnigent-ai/omnigent.git
          git fetch upstream --tags --force

          latest_tag="$(
            git tag --list 'v*' --sort=-version:refname \
              | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
              | sed -n '1p'
          )"
          if [[ -z "$latest_tag" ]]; then
            echo "No stable upstream release tag found." >&2
            exit 1
          fi

          latest_sha="$(git rev-list -n 1 "$latest_tag")"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main_sha" != "$latest_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/main:$current_main_sha" \
              origin "$latest_tag:refs/heads/main"
            echo "Updated main to $latest_tag ($latest_sha)."
          else
            echo "main already mirrors $latest_tag."
          fi

          open_sync_issues="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title | startswith("[upstream-sync]")) | .number')"

          if git merge-base --is-ancestor "$latest_sha" refs/remotes/origin/deadwax; then
            echo "deadwax already contains $latest_tag."
            for issue in $open_sync_issues; do
              gh issue close "$issue" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Deadwax now contains upstream $latest_tag; closing automatically."
            done
            exit 0
          fi

          if [[ -n "$open_sync_issues" ]]; then
            first_issue="${open_sync_issues%%$'\n'*}"
            gh issue comment "$first_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Upstream's latest stable release is now **$latest_tag** ($latest_sha). The clean \`main\` mirror has been refreshed; \`deadwax\` still needs its customization stack rebased and verified."
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[upstream-sync] Rebase Deadwax onto $latest_tag" \
              --body "Upstream released **$latest_tag** ($latest_sha). The workflow updated the clean \`main\` mirror. Rebase the Deadwax customization stack onto this tag, resolve UI conflicts, run the web checks, and publish with \`--force-with-lease\`."
          fi
